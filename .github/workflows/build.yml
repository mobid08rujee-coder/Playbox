name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Android project
        run: |
          flutter create --org com.playbox --project-name playbox --platforms=android tmp_app
          cp -r tmp_app/android ./android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Playbox"#' android/app/src/main/AndroidManifest.xml

      - name: Fixed signing key
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.android
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
