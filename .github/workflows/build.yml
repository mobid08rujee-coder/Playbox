name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Add Android project
        run: |
          flutter create --org com.playbox --project-name playbox --platforms=android tmp_app
          cp -r tmp_app/android ./android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Playbox"#' android/app/src/main/AndroidManifest.xml
      - name: Fixed signing key
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.android
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
          fi
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: playbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
