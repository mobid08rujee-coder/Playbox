name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Android project
        run: |
          flutter create --org com.playbox --project-name playbox --platforms=android .
          cp -r tmp_app/android .
          rm -rf tmp_app
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
